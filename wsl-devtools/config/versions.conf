# shellcheck shell=bash
# shellcheck disable=SC2034 # data file: the variables are read by the scripts that load it (load_config)
# wsl-devtools: pinned versions and version-related settings.
#
# Loaded with load_config (lib/common.sh), which refuses the file unless every
# line is blank, a comment, or NAME="value" where:
#   - NAME is UPPER_CASE (letters, digits, underscores)
#   - value is a plain literal: no $, backticks, backslashes or double quotes

# Supported platform (Phase 0 decision: Ubuntu 24.04 only).
SUPPORTED_UBUNTU_VERSION="24.04"
SUPPORTED_UBUNTU_CODENAME="noble"

# PHP from Ondřej Surý's PPA. Space-separated list of versions the toolkit manages.
PHP_PPA="ondrej/php"
PHP_VERSIONS="8.4 7.4"
# End-of-life versions: modules warn and ask before installing them.
PHP_EOL_VERSIONS="7.4"
# Final upstream PHP 7.4 release. The PPA package adds its own patch revision on top
# (for example 1:7.4.33-31+...); the PHP module shows both.
PHP74_UPSTREAM_VERSION="7.4.33"
PHP_PPA_URL="https://ppa.launchpadcontent.net/ondrej/php/ubuntu"

# Xdebug settings written to a toolkit drop-in, only when no xdebug.* settings exist yet.
XDEBUG_START_WITH_REQUEST="trigger"
XDEBUG_CLIENT_HOST="127.0.0.1"
XDEBUG_CLIENT_PORT="9003"

# Node.js through the official NVM repository (Phase 4, modules/install-nodejs.sh).
# NVM_VERSION is checked to exist (git ls-remote) before installation. v0.41.0 was the
# newest tag on 2026-11-17.
NVM_REPO_URL="https://github.com/nvm-sh/nvm"
NVM_VERSION="v0.41.0"
# The official install.sh is downloaded from <NVM_INSTALL_SCRIPT_URL>/<NVM_VERSION>/install.sh
# and must match this SHA-256 before it runs. Upstream publishes no checksum, so this one was
# computed from the v0.41.0 tag. When you change NVM_VERSION, update NVM_INSTALL_SCRIPT_SHA256 too:
#   curl -fsSL <NVM_INSTALL_SCRIPT_URL>/<new tag>/install.sh | sha256sum
NVM_INSTALL_SCRIPT_URL="https://raw.githubusercontent.com/nvm-sh/nvm"
NVM_INSTALL_SCRIPT_SHA256="045932fe05f0d4247c946f2ec0ec4026dbfd8ce88a5f67ea28d8ea833227f48b"
# Node version installed by "install-nodejs.sh install" (any nvm version string).
NODE_DEFAULT_VERSION="lts/*"

# Composer: official installer, checked against its published SHA-384 signature.
COMPOSER_INSTALL_DIR="/usr/local/bin"
COMPOSER_INSTALLER_URL="https://getcomposer.org/installer"
COMPOSER_SIGNATURE_URL="https://composer.github.io/installer.sig"

# Mailpit (Phase 6, modules/install-mailpit.sh): pinned GitHub release binary for linux/amd64.
# Downloaded from <MAILPIT_DOWNLOAD_URL>/<MAILPIT_VERSION>/mailpit-linux-amd64.tar.gz and checked
# against MAILPIT_SHA256 (equal to the digest GitHub publishes for that asset). v1.33.1 was chosen
# on 2026-11-17 as a settled release; v1.34.0 had been published that same day.
# When you change MAILPIT_VERSION, update MAILPIT_SHA256 too.
MAILPIT_VERSION="v1.33.1"
MAILPIT_DOWNLOAD_URL="https://github.com/axllent/mailpit/releases/download"
MAILPIT_SHA256="84d7fe375ebef25df26758984dc0d5d5e17d8c0734cb2e77be7873b14ab51716"
# Local-only addresses for the SMTP server and the web UI/API.
MAILPIT_SMTP_ADDRESS="127.0.0.1:1025"
MAILPIT_UI_ADDRESS="127.0.0.1:8025"

# Docker Engine (Phase 6, modules/install-docker.sh) from Docker's official apt repository.
# The signing key must have this fingerprint (Docker Release (CE deb) <docker@docker.com>).
DOCKER_APT_URL="https://download.docker.com/linux/ubuntu"
DOCKER_GPG_FINGERPRINT="9DC858229FC7DD38854AE2D88D81803C0EBFCD88"
# Written to a new /etc/docker/daemon.json as "ip" (default address for published container
# ports), only when that file does not exist yet.
DOCKER_DEFAULT_BIND_IP="127.0.0.1"
