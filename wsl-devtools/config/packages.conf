# shellcheck shell=bash
# wsl-devtools: apt package lists, as space-separated strings.
#
# Same format rules as versions.conf (enforced by load_config in lib/common.sh).

# Base command-line tools and apt prerequisites (Phase 2).
BASE_PACKAGES="git curl wget zip unzip ca-certificates gnupg software-properties-common"

# Web server (Phase 3).
NGINX_PACKAGES="nginx"

# PHP (Phase 4). These are suffixes: modules install php<version>-<suffix>,
# for example php8.4-mbstring. Never install unversioned php-* packages,
# because the PPA points them at its own default version (architecture.md section 8).
# Proposed list, to be confirmed in Phase 4 (open question 3).
PHP_COMMON_EXTENSIONS="cli fpm common mysql curl mbstring xml zip intl gd bcmath opcache readline"
PHP74_EXTRA_EXTENSIONS="json"
PHP84_EXTRA_EXTENSIONS=""
PHP_XDEBUG_PACKAGE_SUFFIX="xdebug"

# Databases (Phase 8). MariaDB and MySQL are mutually exclusive (architecture.md section 9).
MARIADB_PACKAGES="mariadb-server mariadb-client"
MYSQL_PACKAGES="mysql-server mysql-client"

# Optional services (Phases 9 and 10).
REDIS_PACKAGES="redis-server"
POSTGRESQL_PACKAGES="postgresql postgresql-contrib"
PHPMYADMIN_PACKAGES="phpmyadmin"

# Docker Engine from Docker's official apt repository, download.docker.com (Phase 11).
DOCKER_PACKAGES="docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin"
