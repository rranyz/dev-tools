# shellcheck shell=bash
# shellcheck disable=SC2034 # data file: the variables are read by the scripts that load it (load_config)
# wsl-devtools: apt package lists, as space-separated strings.
#
# Same format rules as versions.conf (enforced by load_config in lib/common.sh).

# Base command-line tools (Phase 2, modules/install-base.sh).
BASE_PACKAGES="curl wget zip unzip git"

# Needed to add third-party apt sources: the PHP PPA (Phase 3) and Docker's repository (Phase 6).
APT_PREREQUISITE_PACKAGES="ca-certificates gnupg software-properties-common"

# Web server (Phase 3, modules/install-nginx.sh).
NGINX_PACKAGES="nginx"

# PHP (Phase 3). These are suffixes: modules install php<version>-<suffix>,
# for example php8.4-mbstring. Never install unversioned php-* packages,
# because the PPA points them at its own default version (architecture.md section 8).
# common, opcache and readline are pulled in as dependencies of cli.
PHP_EXTENSIONS="cli fpm mysql xml curl gd mbstring zip bcmath intl soap xdebug"
# Per-version extras, named PHP<version without dot>_EXTRA_EXTENSIONS.
PHP74_EXTRA_EXTENSIONS="json"
PHP84_EXTRA_EXTENSIONS=""

# Databases (Phase 5): modules/install-mariadb.sh and modules/install-mysql.sh, Ubuntu's archive.
# MariaDB and MySQL are mutually exclusive (architecture.md section 9): each module refuses
# while the other's packages are installed. Ubuntu 24.04 ships MySQL 8.0 only.
MARIADB_PACKAGES="mariadb-server mariadb-client"
MYSQL_PACKAGES="mysql-server mysql-client"

# Optional services (Phase 6), from Ubuntu's archive.
REDIS_PACKAGES="redis-server"
POSTGRESQL_PACKAGES="postgresql postgresql-contrib"

# Docker Engine from Docker's official apt repository, download.docker.com (Phase 6).
DOCKER_PACKAGES="docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin"
